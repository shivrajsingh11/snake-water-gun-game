<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #e3f2fd, #f4f4f4);
            text-align: center;
        }

        h1 {
            color: #0d47a1;
            margin-top: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .section {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .section:hover {
            transform: scale(1.02);
        }

        button {
            padding: 10px 20px;
            background-color: #0d47a1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1565c0;
        }

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #bbb;
            margin: auto;
            margin-top: 20px;
        }

        p {
            color: #333;
        }
    </style>
</head>

<body>

    <h1>My Portfolio</h1>

    <div class="profile"></div>

    <div class="container">

        <div class="section">
            <h2>About Me</h2>
            <p>I am a Computer Science student interested in programming and web development.</p>
        </div>

        <div class="section">
            <h2>Skills</h2>
            <p>Python, C++, HTML, CSS, DBMS</p>
        </div>

        <div class="section">
            <h2>Projects</h2>
            <p>Attendance Management System</p>
            <p>Snake Water Gun Game</p>
        </div>

        <div class="section">
            <h2>Contact</h2>
            <p>Email: yourname@email.com</p>
            <button>Download Resume</button>
        </div>

    </div>

</body>
</html>
